<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<!-- Mobile-first : la page sera surtout ouverte sur un téléphone -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Joyeux anniversaire Elise ! 🎉</title>

<style>
  /* ============================================================
     PALETTE & RÉGLAGES GÉNÉRAUX
     Ambiance festive, ensoleillée et colorée (pas de violet géné-
     rique). On joue sur le corail, le turquoise et le jaune soleil.
     ============================================================ */
  :root {
    --corail:    #ff5e6c;
    --rose:      #ff8fa3;
    --turquoise: #29c7b7;
    --bleu-ciel: #4dd0e1;
    --jaune:     #ffd23f;
    --orange:    #ff9f1c;
    --creme:     #fff8ec;
    --texte:     #2b2b3a;
    /* Police 100% système : aucune dépendance externe, fonctionne offline */
    --police: "Trebuchet MS", "Segoe UI", system-ui, -apple-system, "Comic Sans MS", sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    font-family: var(--police);
    color: var(--texte);
    overflow: hidden;
    /* Dégradé chaleureux turquoise → jaune (anti-violet) */
    background: linear-gradient(160deg, #4dd0e1 0%, #29c7b7 40%, #ffd23f 100%);
    background-attachment: fixed;
    touch-action: none; /* évite le scroll/zoom intempestif pendant le jeu */
  }

  /* Chaque "écran" occupe tout l'espace. On bascule via la classe .actif */
  .ecran {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    animation: apparition 0.5s ease both;
  }
  .ecran.actif { display: flex; }

  @keyframes apparition {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ---------- Canvas de confettis : couvre toute la page, derrière le contenu ---------- */
  #confettis {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none; /* on peut cliquer à travers */
    z-index: 1;           /* en fond : derrière le contenu, devant le dégradé */
  }

  .ecran > * { position: relative; z-index: 10; }

  /* ============================================================
     ÉCRAN 1 — ACCUEIL
     ============================================================ */
  .gateau { font-size: clamp(64px, 22vw, 130px); animation: rebond 1.6s ease-in-out infinite; }
  @keyframes rebond {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50%      { transform: translateY(-16px) rotate(3deg); }
  }

  h1 {
    font-size: clamp(30px, 9vw, 60px);
    line-height: 1.1;
    margin: 14px 0 6px;
    color: #fff;
    text-shadow: 0 3px 0 var(--corail), 0 6px 12px rgba(0,0,0,.25);
    letter-spacing: .5px;
  }

  .age {
    font-size: clamp(26px, 8vw, 48px);
    font-weight: bold;
    color: var(--texte);
    background: var(--jaune);
    padding: 6px 22px;
    border-radius: 999px;
    box-shadow: 0 6px 0 var(--orange);
    margin-bottom: 26px;
    display: inline-block;
    transform: rotate(-2deg);
  }

  /* Bouton festif réutilisé sur plusieurs écrans */
  .btn {
    font-family: var(--police);
    font-size: clamp(18px, 5.5vw, 26px);
    font-weight: bold;
    color: #fff;
    background: var(--corail);
    border: none;
    padding: 18px 30px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 7px 0 #d63a4a, 0 10px 18px rgba(0,0,0,.2);
    transition: transform .08s ease, box-shadow .08s ease;
    animation: pulse 1.8s ease-in-out infinite;
  }
  .btn:active {
    transform: translateY(5px);
    box-shadow: 0 2px 0 #d63a4a, 0 4px 10px rgba(0,0,0,.2);
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.05); }
  }

  /* ============================================================
     ÉCRAN 2 — JEU
     ============================================================ */
  #ecran-jeu { justify-content: flex-start; padding: 12px; }

  .barre-info {
    width: 100%;
    max-width: 520px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: clamp(18px, 5vw, 26px);
    font-weight: bold;
    color: #fff;
    text-shadow: 0 2px 4px rgba(0,0,0,.3);
    margin-bottom: 8px;
  }
  .barre-info .bloc {
    background: rgba(0,0,0,.18);
    padding: 6px 14px;
    border-radius: 999px;
  }

  /* Zone de jeu : ratio fixe, largeur adaptative */
  #cadre-jeu {
    position: relative;
    width: 100%;
    max-width: 520px;
    background: linear-gradient(180deg, #bdeefb 0%, #e8fbff 100%);
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,.25), inset 0 0 0 4px #fff;
    overflow: hidden;
    flex: 1;
    max-height: 70vh;
  }
  #jeu { display: block; width: 100%; height: 100%; }

  .consigne {
    margin-top: 10px;
    color: #fff;
    font-size: clamp(13px, 3.6vw, 16px);
    text-shadow: 0 1px 3px rgba(0,0,0,.35);
    max-width: 520px;
  }

  /* ============================================================
     ÉCRAN 3 — RÉCOMPENSE / CHOIX DU CADEAU
     ============================================================ */
  #ecran-recompense h1 { margin-bottom: 8px; }
  .sous-titre {
    color: #fff;
    font-size: clamp(18px, 5vw, 26px);
    font-weight: bold;
    margin-bottom: 24px;
    text-shadow: 0 2px 5px rgba(0,0,0,.3);
  }

  .cartes {
    display: flex;
    flex-direction: column;
    gap: 18px;
    width: 100%;
    max-width: 560px;
  }
  @media (min-width: 520px) {
    .cartes { flex-direction: row; }
  }

  .carte {
    flex: 1;
    background: var(--creme);
    border-radius: 22px;
    padding: 26px 18px;
    cursor: pointer;
    box-shadow: 0 8px 0 rgba(0,0,0,.12), 0 12px 24px rgba(0,0,0,.18);
    border: 4px solid transparent;
    transition: transform .12s ease, border-color .12s ease;
  }
  .carte:active { transform: scale(.97); }
  .carte:hover  { border-color: var(--jaune); }
  .carte .emoji { font-size: clamp(48px, 14vw, 78px); display: block; }
  .carte .label {
    font-size: clamp(18px, 5vw, 24px);
    font-weight: bold;
    margin-top: 10px;
    color: var(--texte);
  }
  .carte.cheval { background: linear-gradient(160deg, #ffe9c7, #ffd23f); }
  .carte.chute  { background: linear-gradient(160deg, #d7f6ff, #4dd0e1); }

  /* Petit lien discret pour rejouer (sous les cartes) */
  .rejouer {
    margin-top: 26px;
    background: none;
    border: 2px solid rgba(255,255,255,.7);
    color: #fff;
    padding: 10px 20px;
    border-radius: 999px;
    font-family: var(--police);
    font-size: 16px;
    cursor: pointer;
  }

  /* ============================================================
     POPUP DESCRIPTIF (s'affiche par-dessus l'écran récompense)
     ============================================================ */
  .popup-overlay {
    position: fixed;
    inset: 0;
    z-index: 50;                 /* au-dessus de tout, même des confettis */
    display: none;
    align-items: center;
    justify-content: center;
    padding: 18px;
    background: rgba(20, 30, 40, .55);   /* voile sombre pour faire ressortir le popup */
    backdrop-filter: blur(3px);
  }
  .popup-overlay.actif { display: flex; animation: apparition .3s ease both; }

  .popup-carte {
    position: relative;
    width: 100%;
    max-width: 460px;
    max-height: 88vh;
    overflow-y: auto;
    background: var(--creme);
    border-radius: 26px;
    padding: 30px 24px 26px;
    text-align: center;
    box-shadow: 0 18px 50px rgba(0,0,0,.4);
    animation: popIn .35s cubic-bezier(.18,.89,.32,1.28) both;
  }
  @keyframes popIn {
    from { transform: scale(.8) translateY(20px); opacity: 0; }
    to   { transform: scale(1) translateY(0);     opacity: 1; }
  }

  .popup-fermer {
    position: absolute;
    top: 12px; right: 14px;
    width: 38px; height: 38px;
    border: none;
    border-radius: 50%;
    background: var(--corail);
    color: #fff;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 3px 0 #d63a4a;
    line-height: 1;
  }
  .popup-fermer:active { transform: translateY(2px); box-shadow: 0 1px 0 #d63a4a; }

  .popup-emoji { font-size: clamp(56px, 18vw, 84px); line-height: 1; }
  #popup-titre {
    font-size: clamp(22px, 6vw, 30px);
    color: var(--texte);
    margin: 6px 0 4px;
    line-height: 1.15;
  }
  .popup-lieu {
    display: inline-block;
    background: var(--jaune);
    color: var(--texte);
    font-weight: bold;
    font-size: clamp(14px, 4vw, 17px);
    padding: 5px 14px;
    border-radius: 999px;
    margin-bottom: 14px;
  }
  .popup-desc {
    font-size: clamp(15px, 4.2vw, 18px);
    line-height: 1.5;
    color: #444;
    margin-bottom: 16px;
  }
  .popup-final {
    font-size: clamp(18px, 5vw, 24px);
    font-weight: bold;
    color: var(--corail);
    margin-bottom: 20px;
    line-height: 1.2;
  }
  .popup-ok { font-size: clamp(16px, 4.5vw, 20px); padding: 14px 24px; }

  /* ============================================================
     GYMNASTE + CHIEN qui traversent l'écran d'accueil
     - .gymnaste : déplacement horizontal d'un bord à l'autre
     - .gym-bond / .gym-chien-saut : petit rebond (course)
     - .gym-roue / .gym-chien-flip : roue (rotation 360°) par moments
     ============================================================ */
  .gymnaste {
    position: absolute;
    bottom: 7%;
    left: 0;
    display: flex;
    align-items: flex-end;
    gap: 2px;
    z-index: 12;
    pointer-events: none;            /* laisse cliquer le bouton à travers */
    animation: traverse 18s linear infinite;
    will-change: transform;
  }
  /* Aller-retour : elle marche vers la droite, se retourne, revient */
  @keyframes traverse {
    0%   { transform: translateX(-140px) scaleX(1); }
    48%  { transform: translateX(98vw)  scaleX(1); }
    50%  { transform: translateX(98vw)  scaleX(-1); }
    98%  { transform: translateX(-140px) scaleX(-1); }
    100% { transform: translateX(-140px) scaleX(1); }
  }

  /* Ombre douce sous le duo */
  .gym-ombre {
    position: absolute;
    bottom: -4px;
    left: 50%;
    transform: translateX(-50%);
    width: 92px; height: 11px;
    background: rgba(0,0,0,.18);
    border-radius: 50%;
    filter: blur(1px);
  }

  /* Rebond de course (gymnaste) */
  .gym-bond { animation: gymBond .55s ease-in-out infinite; }
  @keyframes gymBond {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-7px); }
  }

  /* Roue : reste droite, puis tourne sur 360° vers la fin du cycle */
  .gym-roue { transform-origin: 50% 58%; animation: gymRoue 4.2s ease-in-out infinite; }
  @keyframes gymRoue {
    0%, 62%   { transform: rotate(0deg); }
    88%, 100% { transform: rotate(360deg); }
  }

  /* Le chien : mêmes mouvements, légèrement décalés pour le côté rigolo */
  .gym-chien { align-self: flex-end; margin-bottom: 2px; }
  .gym-chien-saut { animation: gymBond .55s ease-in-out infinite; animation-delay: .12s; }
  .gym-chien-flip { transform-origin: 50% 60%; animation: gymRoue 4.2s ease-in-out infinite; animation-delay: .22s; }

  /* On respecte les utilisateurs qui préfèrent moins d'animations */
  @media (prefers-reduced-motion: reduce) {
    .gymnaste, .gym-bond, .gym-roue, .gym-chien-saut, .gym-chien-flip { animation: none; }
    .gymnaste { left: 8%; }
  }
</style>
</head>
<body>

<!-- Canvas unique pour les confettis, partagé par tous les écrans -->
<canvas id="confettis"></canvas>

<!-- ============================ ÉCRAN 1 : ACCUEIL ============================ -->
<section id="ecran-accueil" class="ecran actif">
  <div class="gateau">🎂</div>
  <h1>Joyeux anniversaire Elise&nbsp;!</h1>
  <div class="age">11 ans 🎉</div>
  <button class="btn" id="btn-jouer">🎮 Joue pour gagner ton cadeau</button>
</section>

<!-- Duo « gymnaste + chien » GLOBAL : affiché sur l'accueil ET la page de choix
     (masqué pendant le jeu). Dessin SVG inspiré d'Elise : cheveux blonds mi-longs,
     lunettes rondes, haut rose, leggings foncés et baskets blanches. -->
<div class="gymnaste" id="gymnaste" aria-hidden="true">
    <div class="gym-ombre"></div>

    <!-- Le chiot (golden retriever crème) qui fait la gym avec elle -->
    <div class="gym-chien">
      <div class="gym-chien-saut">
       <div class="gym-chien-flip">
        <svg viewBox="0 0 72 64" width="58" height="52" xmlns="http://www.w3.org/2000/svg">
          <!-- queue -->
          <path d="M9 32 Q1 26 5 17" stroke="#e6caa0" stroke-width="6" fill="none" stroke-linecap="round"/>
          <!-- pattes -->
          <rect x="16" y="42" width="6" height="15" rx="3" fill="#e2c597"/>
          <rect x="44" y="42" width="6" height="15" rx="3" fill="#e2c597"/>
          <rect x="23" y="44" width="6" height="13" rx="3" fill="#f0dcae"/>
          <rect x="38" y="44" width="6" height="13" rx="3" fill="#f0dcae"/>
          <!-- corps -->
          <ellipse cx="32" cy="36" rx="20" ry="12" fill="#f0dcae"/>
          <!-- tête -->
          <circle cx="52" cy="27" r="12" fill="#f0dcae"/>
          <!-- museau -->
          <ellipse cx="62" cy="30" rx="7" ry="5.5" fill="#f8edd2"/>
          <!-- oreille tombante -->
          <path d="M46 16 Q43 29 50 36 Q55 29 54 18 Z" fill="#e0bf90"/>
          <!-- truffe -->
          <circle cx="66" cy="29" r="2.4" fill="#3a2f2a"/>
          <!-- oeil -->
          <circle cx="54" cy="25" r="1.8" fill="#3a2f2a"/>
          <!-- petit sourire -->
          <path d="M60 33 Q63 36 66 33" stroke="#3a2f2a" stroke-width="1" fill="none" stroke-linecap="round"/>
        </svg>
       </div>
      </div>
    </div>

    <div class="gym-bond">
      <div class="gym-roue">
        <svg viewBox="0 0 80 150" width="84" height="158" xmlns="http://www.w3.org/2000/svg">
          <!-- cheveux arrière (mi-longs, blonds) -->
          <path d="M24 30 Q17 60 25 90 L55 90 Q63 60 56 30 Z" fill="#d9b36a"/>
          <!-- jambes (leggings foncés) -->
          <path d="M34 92 L32 139 L39 139 L40 92 Z" fill="#2f3a56"/>
          <path d="M46 92 L48 139 L41 139 L40 92 Z" fill="#2f3a56"/>
          <!-- baskets blanches -->
          <rect x="28" y="138" width="14" height="8" rx="3.5" fill="#ffffff" stroke="#cfd6dd" stroke-width="1"/>
          <rect x="38" y="138" width="14" height="8" rx="3.5" fill="#ffffff" stroke="#cfd6dd" stroke-width="1"/>
          <!-- petite jupe/short bleu marine -->
          <path d="M30 86 Q40 82 50 86 L53 101 Q40 106 27 101 Z" fill="#2f3a56"/>
          <!-- corps : haut rose -->
          <path d="M31 59 Q40 55 49 59 L51 90 Q40 94 29 90 Z" fill="#ff5d8f"/>
          <!-- bras levés en V (pose de gym) -->
          <line x1="33" y1="62" x2="19" y2="42" stroke="#ff5d8f" stroke-width="7" stroke-linecap="round"/>
          <line x1="47" y1="62" x2="61" y2="42" stroke="#ff5d8f" stroke-width="7" stroke-linecap="round"/>
          <circle cx="18" cy="41" r="4.2" fill="#f6d3b3"/>
          <circle cx="62" cy="41" r="4.2" fill="#f6d3b3"/>
          <!-- cou -->
          <rect x="37" y="51" width="6" height="9" fill="#f6d3b3"/>
          <!-- tête -->
          <circle cx="40" cy="40" r="15" fill="#f7d7b8"/>
          <!-- frange / cheveux avant -->
          <path d="M25 38 Q26 23 40 22 Q54 23 55 38 Q49 30 40 30 Q31 30 25 38 Z" fill="#d9b36a"/>
          <!-- lunettes rondes -->
          <circle cx="34" cy="41" r="5" fill="#ffffff" fill-opacity=".30" stroke="#333" stroke-width="1.6"/>
          <circle cx="46" cy="41" r="5" fill="#ffffff" fill-opacity=".30" stroke="#333" stroke-width="1.6"/>
          <line x1="39" y1="41" x2="41" y2="41" stroke="#333" stroke-width="1.6"/>
          <!-- yeux -->
          <circle cx="34" cy="41" r="1.7" fill="#3a2f2a"/>
          <circle cx="46" cy="41" r="1.7" fill="#3a2f2a"/>
          <!-- joues roses -->
          <circle cx="30" cy="46" r="2" fill="#ff9bb5" opacity=".6"/>
          <circle cx="50" cy="46" r="2" fill="#ff9bb5" opacity=".6"/>

          <path d="M35 47 Q40 51 45 47" fill="none" stroke="#c0506a" stroke-width="1.7" stroke-linecap="round"/>

  </div>

<!-- ============================ ÉCRAN 2 : JEU ============================ -->
<section id="ecran-jeu" class="ecran">
  <div class="barre-info">
    <span class="bloc">🎁 <span id="score">0</span>/10</span>
    <span class="bloc">❤️ <span id="vies">3</span></span>
  </div>
  <div id="cadre-jeu">
    <canvas id="jeu"></canvas>
  </div>
  <p class="consigne">Attrape 10 cadeaux 🎁 et évite les bombes 💣&nbsp;!<br>
     Flèches ⬅️ ➡️ au clavier, ou glisse ton doigt sur l'écran.</p>
</section>

<!-- ====================== ÉCRAN 3 : RÉCOMPENSE / CHOIX ====================== -->
<section id="ecran-recompense" class="ecran">
  <div id="bloc-choix">
    <h1>Bravo Elise&nbsp;! 🏆</h1>
    <p class="sous-titre">Choisis ton cadeau&nbsp;:</p>
    <div class="cartes">
      <div class="carte cheval" data-cadeau="cheval">
        <span class="emoji">🐴</span>
        <span class="label">Une après-midi à cheval</span>
      </div>
      <div class="carte chute" data-cadeau="chute">
        <span class="emoji">🪂</span>
        <span class="label">Une simulation de chute libre</span>
      </div>
    </div>
    <button class="rejouer" id="btn-rejouer">↺ Rejouer</button>
  </div>
</section>

<!-- ============== POPUP DESCRIPTIF (par-dessus l'écran récompense) ============== -->
<div id="popup" class="popup-overlay">
  <div class="popup-carte" role="dialog" aria-modal="true">
    <button class="popup-fermer" id="popup-fermer" aria-label="Fermer">✕</button>
    <div class="popup-emoji" id="popup-emoji"></div>
    <h2 id="popup-titre"></h2>
    <p class="popup-lieu" id="popup-lieu"></p>
    <p class="popup-desc" id="popup-desc"></p>
    <p class="popup-final" id="popup-final"></p>
    <button class="btn popup-ok" id="popup-ok">↩︎ Revenir au choix</button>
  </div>
</div>

<script>
/* ================================================================
   GESTION DES ÉCRANS
   On affiche un seul écran à la fois en jouant sur la classe .actif
   ================================================================ */
const ecrans = {
  accueil:    document.getElementById('ecran-accueil'),
  jeu:        document.getElementById('ecran-jeu'),
  recompense: document.getElementById('ecran-recompense'),
};

function afficherEcran(nom) {
  Object.values(ecrans).forEach(e => e.classList.remove('actif'));
  ecrans[nom].classList.add('actif');
  // Le duo gymnaste + chien se balade sur l'accueil et la page de choix,
  // mais on le cache pendant le jeu pour ne pas gêner.
  const duo = document.getElementById('gymnaste');
  if (duo) duo.style.display = (nom === 'jeu') ? 'none' : 'flex';
}

/* ================================================================
   CONFETTIS (canvas plein écran, boucle permanente)
   Chaque confetti est un petit rectangle coloré qui tombe en
   tournoyant. On peut booster temporairement leur nombre.
   ================================================================ */
const cvConf = document.getElementById('confettis');
const ctxConf = cvConf.getContext('2d');
let confettis = [];
const COULEURS = ['#ff5e6c', '#ffd23f', '#29c7b7', '#4dd0e1', '#ff9f1c', '#ff8fa3', '#ffffff'];

function dimensionnerConfettis() {
  cvConf.width  = window.innerWidth;
  cvConf.height = window.innerHeight;
}
window.addEventListener('resize', dimensionnerConfettis);
dimensionnerConfettis();

// Crée un confetti, soit en pluie normale (en haut), soit en explosion depuis un point
function creerConfetti(explosion = false) {
  return {
    x: explosion ? cvConf.width / 2  : Math.random() * cvConf.width,
    y: explosion ? cvConf.height / 2 : -20,
    taille: 6 + Math.random() * 8,
    couleur: COULEURS[(Math.random() * COULEURS.length) | 0],
    vx: explosion ? (Math.random() - 0.5) * 14 : (Math.random() - 0.5) * 2,
    vy: explosion ? (Math.random() - 0.5) * 14 : 1.5 + Math.random() * 2.5,
    angle: Math.random() * Math.PI * 2,
    vitesseAngle: (Math.random() - 0.5) * 0.3,
  };
}

// Quantité de confettis "de fond" entretenue en permanence
let densiteFond = 60;
function entretenirFond() {
  while (confettis.length < densiteFond) confettis.push(creerConfetti(false));
}

// Explosion ponctuelle (utilisée au choix du cadeau)
function exploserConfettis(n = 160) {
  for (let i = 0; i < n; i++) confettis.push(creerConfetti(true));
}

function animerConfettis() {
  ctxConf.clearRect(0, 0, cvConf.width, cvConf.height);
  for (let i = confettis.length - 1; i >= 0; i--) {
    const c = confettis[i];
    c.x += c.vx;
    c.y += c.vy;
    c.vy += 0.04;            // légère gravité
    c.angle += c.vitesseAngle;

    ctxConf.save();
    ctxConf.translate(c.x, c.y);
    ctxConf.rotate(c.angle);
    ctxConf.fillStyle = c.couleur;
    ctxConf.fillRect(-c.taille / 2, -c.taille / 2, c.taille, c.taille * 0.6);
    ctxConf.restore();

    // Recyclage : on retire ceux sortis de l'écran
    if (c.y > cvConf.height + 30) confettis.splice(i, 1);
  }
  entretenirFond();
  requestAnimationFrame(animerConfettis);
}
animerConfettis();

/* ================================================================
   MINI-JEU « ATTRAPE-CADEAUX »
   - Un panier 🧺 se déplace en bas (clavier + tactile).
   - Des cadeaux 🎁 et des bombes 💣 tombent du haut.
   - 10 cadeaux attrapés = victoire ; 0 vie = on relance.
   ================================================================ */
const cvJeu = document.getElementById('jeu');
const ctxJeu = cvJeu.getContext('2d');
const cadreJeu = document.getElementById('cadre-jeu');

let L = 0, H = 0;          // largeur / hauteur logiques du canvas
let panier, objets, score, vies;
let gauchePressee = false, droitePressee = false;
let jeuEnCours = false;
let dernierLancer = 0;
let frameJeu = null;

const elScore = document.getElementById('score');
const elVies  = document.getElementById('vies');

// Ajuste la résolution du canvas à la taille réelle du cadre (net sur écrans HD).
// Renvoie false tant que le cadre n'a pas encore de dimensions (canvas non prêt).
function dimensionnerJeu() {
  const w = cadreJeu.clientWidth;
  const h = cadreJeu.clientHeight;
  if (!w || !h) return false;                  // pas encore affiché / mesuré → on réessaiera
  L = w;
  H = h;
  const dpr = window.devicePixelRatio || 1;
  cvJeu.width  = L * dpr;
  cvJeu.height = H * dpr;
  ctxJeu.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (panier) {
    panier.largeur = Math.max(90, L * 0.26);   // panier large = jeu facile
    panier.y = H - 70;
    panier.x = Math.max(0, Math.min(panier.x, L - panier.largeur)); // garde le panier dans le cadre
  }
  return true;
}
window.addEventListener('resize', () => { if (jeuEnCours) dimensionnerJeu(); });

function initJeu() {
  L = 0; H = 0;                         // forcera le garde-fou si pas encore mesuré
  panier = { largeur: 100, hauteur: 46, x: 0, y: 0, vitesse: 8 };
  objets = [];
  score = 0;
  vies = 3;
  dernierLancer = 0;
  majInfos();
  centrerPanier();                      // place le panier dès qu'une taille est dispo
}

// Centre le panier en bas, une fois que le canvas a une taille valide
function centrerPanier() {
  if (dimensionnerJeu()) {
    panier.largeur = Math.max(90, L * 0.26);
    panier.x = L / 2 - panier.largeur / 2;
    panier.y = H - 70;
  }
}

function majInfos() {
  elScore.textContent = score;
  elVies.textContent  = vies;
}

// Crée un objet qui tombe : 80% de cadeaux, 20% de bombes
function lancerObjet() {
  const estBombe = Math.random() < 0.2;
  objets.push({
    x: 20 + Math.random() * (L - 40),
    y: -30,
    taille: 38,
    vitesse: 1.8 + Math.random() * 1.2,   // chute modérée → facile
    bombe: estBombe,
    emoji: estBombe ? '💣' : '🎁',
  });
}

function boucleJeu(t) {
  if (!jeuEnCours) return;

  // Garde-fou : tant que le canvas n'a pas de vraie taille, on ne fait RIEN
  // (ni apparition d'objets, ni collisions) et on retente au prochain frame.
  // Évite que des cadeaux/bombes apparaissent au point (0,0) et soient "attrapés".
  if (!L || !H) {
    centrerPanier();
    frameJeu = requestAnimationFrame(boucleJeu);
    return;
  }

  ctxJeu.clearRect(0, 0, L, H);

  // --- Déplacement du panier (clavier) ---
  if (gauchePressee) panier.x -= panier.vitesse;
  if (droitePressee) panier.x += panier.vitesse;
  panier.x = Math.max(0, Math.min(L - panier.largeur, panier.x));

  // --- Apparition régulière d'objets (toutes ~0.9 s) ---
  if (t - dernierLancer > 900) {
    lancerObjet();
    dernierLancer = t;
  }

  // --- Mise à jour + dessin des objets ---
  ctxJeu.font = '34px serif';
  ctxJeu.textAlign = 'center';
  ctxJeu.textBaseline = 'middle';

  for (let i = objets.length - 1; i >= 0; i--) {
    const o = objets[i];
    o.y += o.vitesse;
    ctxJeu.fillText(o.emoji, o.x, o.y);

    // Collision avec le haut du panier
    const dansX = o.x > panier.x && o.x < panier.x + panier.largeur;
    const dansY = o.y > panier.y - 10 && o.y < panier.y + panier.hauteur;
    if (dansX && dansY) {
      if (o.bombe) {
        vies--;
        flashRouge();
        if (vies <= 0) { majInfos(); return finPartie(false); }
      } else {
        score++;
        bravoFlash();            // petit retour visuel local (pas de confettis plein écran)
        if (score >= 10) { majInfos(); return finPartie(true); }
      }
      majInfos();
      objets.splice(i, 1);
      continue;
    }

    // Objet sorti par le bas → on le retire
    if (o.y > H + 30) objets.splice(i, 1);
  }

  // --- Dessin du panier ---
  dessinerPanier();

  frameJeu = requestAnimationFrame(boucleJeu);
}

function dessinerPanier() {
  const p = panier;
  // Corps du panier
  ctxJeu.fillStyle = '#a8651f';
  ctxJeu.strokeStyle = '#7a4710';
  ctxJeu.lineWidth = 4;
  roundRect(ctxJeu, p.x, p.y, p.largeur, p.hauteur, 12);
  ctxJeu.fill();
  ctxJeu.stroke();
  // Liseré clair
  ctxJeu.fillStyle = '#c98a3e';
  roundRect(ctxJeu, p.x + 6, p.y + 6, p.largeur - 12, 12, 6);
  ctxJeu.fill();
  // Emoji panier au centre pour le côté ludique
  ctxJeu.font = '28px serif';
  ctxJeu.fillText('🧺', p.x + p.largeur / 2, p.y + p.hauteur / 2 + 2);
}

// Petit utilitaire : rectangle à coins arrondis
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// Petit effet vert/rebond sur le score quand on attrape un cadeau
function bravoFlash() {
  const bloc = elScore.parentElement;
  bloc.style.transition = 'transform .12s ease';
  bloc.style.transform = 'scale(1.35)';
  setTimeout(() => { bloc.style.transform = 'scale(1)'; }, 130);
}

// Flash rouge bref quand une bombe est touchée
function flashRouge() {
  cadreJeu.style.transition = 'box-shadow .1s';
  cadreJeu.style.boxShadow = '0 0 0 6px #ff5e6c, 0 10px 30px rgba(0,0,0,.25)';
  setTimeout(() => {
    cadreJeu.style.boxShadow = '0 10px 30px rgba(0,0,0,.25), inset 0 0 0 4px #fff';
  }, 160);
}

function demarrerPartie() {
  // IMPORTANT : on affiche l'écran AVANT de dimensionner le canvas,
  // sinon le cadre est encore masqué (display:none) et mesure 0×0.
  afficherEcran('jeu');
  initJeu();
  jeuEnCours = true;
  cancelAnimationFrame(frameJeu);
  // Sécurité : on re-dimensionne une fois la mise en page stabilisée
  // (utile sur mobile où la taille définitive arrive après l'affichage).
  requestAnimationFrame(() => {
    centrerPanier();
    frameJeu = requestAnimationFrame(boucleJeu);
  });
}

function finPartie(victoire) {
  jeuEnCours = false;
  cancelAnimationFrame(frameJeu);
  if (victoire) {
    densiteFond = 120;          // on intensifie les confettis de fond
    exploserConfettis(180);
    afficherEcran('recompense');
  } else {
    // Plus de vies : petit message puis on relance le jeu
    setTimeout(() => {
      alert('Oups, plus de vies ! 💣 On recommence, tu vas y arriver 💪');
      demarrerPartie();
    }, 100);
  }
}

/* -------------------- CONTRÔLES -------------------- */
// Clavier
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')  gauchePressee = true;
  if (e.key === 'ArrowRight') droitePressee = true;
});
window.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft')  gauchePressee = false;
  if (e.key === 'ArrowRight') droitePressee = false;
});

// Tactile + souris : le panier suit le doigt / le curseur
function deplacerVers(clientX) {
  if (!jeuEnCours) return;
  const r = cvJeu.getBoundingClientRect();
  const x = clientX - r.left;
  panier.x = Math.max(0, Math.min(L - panier.largeur, x - panier.largeur / 2));
}
cvJeu.addEventListener('touchmove', e => {
  e.preventDefault();
  deplacerVers(e.touches[0].clientX);
}, { passive: false });
cvJeu.addEventListener('touchstart', e => {
  deplacerVers(e.touches[0].clientX);
}, { passive: false });
cvJeu.addEventListener('mousemove', e => deplacerVers(e.clientX));

/* ================================================================
   CHOIX DU CADEAU (écran 3) + POPUP DESCRIPTIF
   Au clic sur une carte : salve de confettis renforcée + ouverture
   d'un popup qui explique l'activité (lieu réel + description).
   On peut le refermer pour revenir au choix.
   ================================================================ */
const cadeaux = {
  cheval: {
    emoji: '🐴',
    titre: 'Une après-midi à cheval',
    lieu:  '🏞️ Équilibres — Stoumont (Ardennes)',
    desc:  "Tu pars en balade à cheval en pleine nature, dans les superbes paysages " +
           "des Ardennes à Stoumont. Les chevaux d'Équilibres vivent en liberté, en troupeau, " +
           "et sont adaptés à tous les niveaux — débutants bienvenus ! Une guide passionnée " +
           "t'accompagne pendant toute la promenade. 🌲🐎",
    final: 'Génial, on part faire du cheval ! 🐴',
  },
  chute: {
    emoji: '🪂',
    titre: 'Une simulation de chute libre',
    lieu:  '✈️ FLYIN — Liège Airport',
    desc:  "Direction l'une des plus grandes souffleries d'Europe ! Tu voles pour de vrai, " +
           "portée par une colonne d'air qui souffle jusqu'à 300 km/h : la même sensation " +
           "qu'un saut en parachute depuis 4000 m, mais en toute sécurité, juste au-dessus du sol. " +
           "Des moniteurs pros restent avec toi tout le temps. 🚀",
    final: 'Accroche-toi, ça va voler ! 🪂',
  },
};

const popup = document.getElementById('popup');

function ouvrirPopup(choix) {
  const c = cadeaux[choix];
  document.getElementById('popup-emoji').textContent = c.emoji;
  document.getElementById('popup-titre').textContent = c.titre;
  document.getElementById('popup-lieu').textContent  = c.lieu;
  document.getElementById('popup-desc').textContent  = c.desc;
  document.getElementById('popup-final').textContent = c.final;
  popup.classList.add('actif');
  // Confettis de fête renforcés
  densiteFond = 160;
  exploserConfettis(260);
}

function fermerPopup() {
  popup.classList.remove('actif');
  densiteFond = 120;   // on calme un peu les confettis, on reste sur l'écran de choix
}

document.querySelectorAll('.carte').forEach(carte => {
  carte.addEventListener('click', () => ouvrirPopup(carte.dataset.cadeau));
});

// Fermeture : bouton ✕, bouton "Revenir au choix", ou clic sur le voile
document.getElementById('popup-fermer').addEventListener('click', fermerPopup);
document.getElementById('popup-ok').addEventListener('click', fermerPopup);
popup.addEventListener('click', e => { if (e.target === popup) fermerPopup(); });

/* ================================================================
   BOUTONS DE NAVIGATION
   ================================================================ */
document.getElementById('btn-jouer').addEventListener('click', demarrerPartie);

document.getElementById('btn-rejouer').addEventListener('click', () => {
  // Relance depuis l'accueil
  densiteFond = 60;
  fermerPopup();
  afficherEcran('accueil');
});
</script>
</body>
